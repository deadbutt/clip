[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dieshang-workbench"
version = "0.1.0"
description = "Local Whisper subtitle, speaker labeling, and clip export workbench"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "DieShang Workbench" }]
dependencies = [
  "faster-whisper>=1.1.0",
  "numpy>=1.26,<3",
  "av>=14.0",
  "soundfile>=0.12",
  "packaging",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "sentencepiece>=0.2.0",
]

[project.scripts]
mtd-subtitle = "moss_transcribe_diarize.app.cli:main"
mtd-subtitle-web = "moss_transcribe_diarize.app.web_cli:main"
mtd-translate-opus-run = "moss_transcribe_diarize.app.opus_run_translator:main"

[project.optional-dependencies]
torch-runtime = [
  "torch>=2.8",
  "torchaudio>=2.8",
  "librosa>=0.11.0",
  "numba>=0.61.0",
  "soxr>=0.5",
  "openai-whisper>=20231117",
]
diarization = [
  "pyannote.audio>=3.1",
]
flash-attn = ["flash-attn"]
dev = ["pytest", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["moss_transcribe_diarize*"]

[tool.setuptools.package-data]
moss_transcribe_diarize = ["app/static/*"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
# 保守规则集: pyflakes 错误(F)+pycodestyle 子集(E4/E7/E9)+import 排序(I)。
# 不开 BLE/TRY 等风格规则——本项目大量 blind-except 是刻意的容错设计。
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["moss_transcribe_diarize"]
