[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dieshang-workbench"
version = "0.1.0"
description = "Local Whisper subtitle, speaker labeling, and clip export workbench"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "DieShang Workbench" }]
dependencies = [
  "faster-whisper>=1.1.0",
  "numpy>=1.26,<3",
  "av>=14.0",
  "soundfile>=0.12",
  "packaging",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "sentencepiece>=0.2.0",
]

[project.scripts]
mtd-subtitle = "moss_transcribe_diarize.app.cli:main"
mtd-subtitle-web = "moss_transcribe_diarize.app.web_cli:main"
mtd-translate-opus-run = "moss_transcribe_diarize.app.opus_run_translator:main"

[project.optional-dependencies]
torch-runtime = [
  "torch>=2.8",
  "torchaudio>=2.8",
  "librosa>=0.11.0",
  "numba>=0.61.0",
  "soxr>=0.5",
  "openai-whisper>=20231117",
]
diarization = [
  "pyannote.audio>=3.1",
]
flash-attn = ["flash-attn"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["moss_transcribe_diarize*"]

[tool.setuptools.package-data]
moss_transcribe_diarize = ["app/static/*"]
